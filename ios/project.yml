name: Awake
options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: M2H88Z5S5A
    MARKETING_VERSION: 0.7.6
    CURRENT_PROJECT_VERSION: 13
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  AwakeIOS:
    type: application
    platform: iOS
    sources:
      - Awake
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seven.awake.ios
        PRODUCT_NAME: Awake
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES
  AwakeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AwakeTests]
    dependencies:
      - target: AwakeIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seven.awake.ios.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Awake.app/Awake
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
  AwakeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AwakeUITests]
    dependencies:
      - target: AwakeIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seven.awake.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AwakeIOS:
    build:
      targets:
        AwakeIOS: all
    test:
      environmentVariables:
        AWAKE_CONNECTOR_INTEGRATION: $(AWAKE_CONNECTOR_INTEGRATION)
      targets:
        - AwakeTests
        - AwakeUITests
