name: release

# 只出 macOS 产物。
#
# iOS 不在 CI 里出包，两次实测都不通（run 45207790417 / 45208937945）：
# - macos-15 只有 Xcode 16.4，项目用到 iOS 26 的 glassEffect / tabViewBottomAccessory，编译 exit 65；
# - macos-26 自带 Xcode 26.6，但在这台镜像上 `xcodebuild -version` 直接崩溃（XcodebuildPreIDEHandler）。
# 所以 IPA 走本地 Tools/build_ios_app.sh，并复制到 iCloud。
#
# 版本号来源：推送 v* tag（取 tag 名去 v），或手动触发时填的 input。
# workflow 不改文件——版本 bump 在提交里完成。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.9.40（对应 tag v0.9.40；tag 不存在时只出产物不发布）"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.detect.outputs.value }}
    steps:
      - id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build macOS app
        env:
          AWAKE_ARCHS: arm64
        run: bash Tools/build_rust_app.sh

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.value }}"
          cd dist-rust
          ditto -c -k --keepParent Awake.app "Awake-${VERSION}-macos-arm64.zip"
          shasum -a 256 "Awake-${VERSION}-macos-arm64.zip" > "Awake-${VERSION}-macos-arm64.zip.sha256"
          lipo -archs Awake.app/Contents/MacOS/Awake
          ls -lh "Awake-${VERSION}-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            dist-rust/Awake-*-macos-arm64.zip
            dist-rust/Awake-*-macos-arm64.zip.sha256
          if-no-files-found: error

  publish:
    needs: [version, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find artifacts -type f \( -name '*.zip' -o -name '*.sha256' \))
          printf '%s\n' "${FILES[@]}"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes "见 docs/releases/${TAG}.md"
          gh release upload "$TAG" "${FILES[@]}" --repo "${{ github.repository }}" --clobber
