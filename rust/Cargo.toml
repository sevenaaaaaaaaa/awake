[workspace]
resolver = "2"
members = [
    "crates/awake-core",
    "crates/awake-cli",
    "crates/awake-app",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
symphonia = { version = "0.5", default-features = false, features = [
    "flac", "alac", "wav", "aiff", "caf", "mp3", "aac", "isomp4", "ogg", "vorbis", "pcm",
] }
cpal = "0.16"
rustfft = "6"
lofty = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
